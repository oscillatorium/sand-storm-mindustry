item.sand-stormv2-pyrit.description = Используется в электронике и продвинутых постройках.
item.sand-stormv2-pyrit.details = Называйте как хотите: дисульфид железа, золото дураков, марказит, FeS2, неорганическое бинарное соединение железа с серой или железный кочелдан

