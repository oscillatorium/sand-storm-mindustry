// Мод
mod.sand-stormv2.name = [#e8d174]Sand Storm
mod.sand-stormv2.author = Чмоня
mod.sand-stormv2.description = Этот мод добавляет «Аридум» – пустынную планету с залежами окаменелостей и привкусом реалистичной химии и сюжета. На самом деле это лишь одна из 3 планет, которая планируется в моде, но пока что только в разработке. \n\n[accent]Автор мода: Чмоня[] \n[accent]Идеи для контента: Кселирит, Чмоня[] \n[accent]Карты: Чмоня, Никита, Великий Ритег, Кселирит[] \n[accent]Спрайты: Чмоня, Кселирит, Айпикс (Ipixgamez)[] \n[accent]Код: Чмоня, Кселирит, Blehhhh cat[] \n\n[#e8d174]Вы всегда можете присоединиться к нашему Дискорд сообществу (ссылка на гитхабе, который во вкладке «сайт») и предложить свои идеи для контента
mod.sand-stormv2.subtitle = [#e8d174]0.35-альфа: будет НЕ скоро...

